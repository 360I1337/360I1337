name: profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 stats.py
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Check token expiry
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          head=$(curl -sI -H "Authorization: token $METRICS_TOKEN" https://api.github.com/user | tr -d '\015')
          exp=$(printf '%s\n' "$head" | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -z "$exp" ]; then
            echo "METRICS_TOKEN: no expiry date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "METRICS_TOKEN expires $exp ($days days left)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$days" -lt 21 ]; then
            echo "::warning::METRICS_TOKEN expires in $days days, the cards will stop updating"
          fi

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
