<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a18"/>
      <stop offset=".55" stop-color="#15113a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .glow { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(-120px, 0); } to { transform: translate(120px, 20px); } }
    .line { opacity: 0; animation: type 12s linear infinite both; }
    .l1 { opacity: 1; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    @keyframes type {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); }
      12%  { opacity: 1; clip-path: inset(0 0 0 0); }
      30%  { opacity: 1; clip-path: inset(0 0 0 0); }
      33%  { opacity: 0; clip-path: inset(0 0 0 0); }
      100% { opacity: 0; clip-path: inset(0 0 0 0); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse class="glow" cx="600" cy="150" rx="420" ry="170" fill="url(#glow)"/>
    <text class="mono" x="600" y="160" text-anchor="middle" font-size="104" font-weight="700" fill="url(#title)" letter-spacing="4">miquella</text>
    <g class="mono" font-size="28" fill="#c4b5fd" text-anchor="middle">
      <text class="line l1" x="600" y="222">Go · Python · JavaScript</text>
      <text class="line l2" x="600" y="222">VPN infrastructure &amp; network transports</text>
      <text class="line l3" x="600" y="222">Telegram bots &amp; Yandex Games titles</text>
    </g>
    <text class="mono caret" x="600" y="270" text-anchor="middle" font-size="22" fill="#6d5bd0">_</text>
    <rect x="0" y="316" width="1200" height="4" fill="#7c3aed" opacity=".6"/>
  </g>
</svg>
